<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cowork Local</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e7eaf0;
    --muted: #8b93a7; --accent: #5b8cff; --danger: #ff6b6b; --ok: #3ecf8e;
    --warn: #ffb454;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.idle { background: var(--muted); }
  .dot.thinking, .dot.running { background: var(--accent); animation: pulse 1.1s infinite; }
  .dot.awaiting_approval { background: var(--warn); }
  .dot.error { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .status { color: var(--muted); font-size: 13px; margin-right: auto; }
  header label { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .item { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--panel); }
  .item .role { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
  .item.user { background: #1b2740; border-color: #284067; }
  .item.thinking { background: transparent; border-style: dashed; color: var(--muted); }
  .item pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; font-size: 13px;
    background: #0c0e13; padding: 8px; border-radius: 8px; max-height: 320px; overflow: auto; }
  .tool .role { color: var(--accent); }
  .tool.err .role { color: var(--danger); }
  .approval { border-color: var(--warn); background: #2a2113; }
  .approval .actions { display: flex; gap: 8px; margin-top: 10px; }
  button {
    font: inherit; border: 0; border-radius: 9px; padding: 9px 14px; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 600;
  }
  button.ghost { background: #222836; color: var(--text); }
  button.deny { background: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  footer { padding: 10px; background: var(--panel); border-top: 1px solid var(--line);
    display: flex; gap: 8px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  textarea {
    flex: 1; resize: none; background: #0c0e13; color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; font: inherit; max-height: 120px;
  }
  .gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center;
    justify-content: center; padding: 20px; }
  .gate .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px; width: 100%; max-width: 360px; }
  .gate input { width: 100%; padding: 11px; border-radius: 9px; border: 1px solid var(--line);
    background: #0c0e13; color: var(--text); font: inherit; margin: 12px 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="gate" class="gate">
    <div class="card">
      <h1 style="margin:0 0 4px">Cowork Local</h1>
      <div class="muted">Enter the access token printed in your server console.</div>
      <input id="tokenInput" type="password" placeholder="Access token" autocomplete="off" />
      <button id="connectBtn" style="width:100%">Connect</button>
      <div id="gateErr" class="muted" style="color:var(--danger);margin-top:10px"></div>
    </div>
  </div>

  <header class="hidden" id="appHeader">
    <span class="dot idle" id="dot"></span>
    <h1>Cowork Local</h1>
    <span class="status" id="statusText">idle</span>
    <label><input type="checkbox" id="autoApprove" /> auto-approve</label>
    <button class="ghost" id="interruptBtn" style="padding:6px 10px">Stop</button>
  </header>

  <div id="log" class="hidden"></div>

  <footer class="hidden" id="composer">
    <textarea id="input" rows="1" placeholder="Send a task to your computer…"></textarea>
    <button id="sendBtn">Send</button>
  </footer>

<script>
const $ = (id) => document.getElementById(id);
let TOKEN = localStorage.getItem("cowork_token") || "";
let es = null;
const seen = {}; // event id -> dom node, to coalesce streamed deltas

function api(path, body) {
  return fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + TOKEN },
    body: JSON.stringify(body || {}),
  });
}

function setStatus(status) {
  $("dot").className = "dot " + status;
  $("statusText").textContent = status.replace("_", " ");
}

function el(cls, role, text) {
  const div = document.createElement("div");
  div.className = "item " + cls;
  if (role) { const r = document.createElement("div"); r.className = "role"; r.textContent = role; div.appendChild(r); }
  if (text !== undefined) { const p = document.createElement("div"); p.textContent = text; div.appendChild(p); }
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
  return div;
}

function pre(parent, text) {
  const p = document.createElement("pre"); p.textContent = text; parent.appendChild(p); return p;
}

// streaming text accumulators, keyed by a logical block ("assistant"/"thinking")
let acc = { assistant: null, thinking: null };

function appendDelta(kind, text) {
  if (!acc[kind]) {
    const div = el(kind === "thinking" ? "thinking" : "assistant",
                   kind === "thinking" ? "thinking" : "assistant", "");
    acc[kind] = pre(div, "");
  }
  acc[kind].textContent += text;
  $("log").scrollTop = $("log").scrollHeight;
}

function flushBlocks() { acc = { assistant: null, thinking: null }; }

function handle(ev) {
  switch (ev.type) {
    case "snapshot":
      setStatus(ev.status);
      $("autoApprove").checked = ev.auto_approve;
      break;
    case "status": setStatus(ev.status); break;
    case "settings": $("autoApprove").checked = ev.auto_approve; break;
    case "user": flushBlocks(); el("user", "you", ev.text); break;
    case "thinking_delta": appendDelta("thinking", ev.text); break;
    case "assistant_delta": appendDelta("assistant", ev.text); break;
    case "block_stop": break;
    case "tool_use": {
      flushBlocks();
      const d = el("tool", ev.name + (ev.decision === "pending" ? " · awaiting approval" : ""));
      pre(d, JSON.stringify(ev.input, null, 2));
      break;
    }
    case "approval_required": {
      flushBlocks();
      const d = el("approval", "approve action?");
      pre(d, ev.risk);
      const actions = document.createElement("div"); actions.className = "actions";
      const allow = document.createElement("button"); allow.textContent = "Allow";
      const deny = document.createElement("button"); deny.textContent = "Deny"; deny.className = "deny";
      const done = (decision) => { api("/api/approve", { id: ev.id, decision });
        allow.disabled = deny.disabled = true; };
      allow.onclick = () => done("allow");
      deny.onclick = () => done("deny");
      actions.appendChild(allow); actions.appendChild(deny); d.appendChild(actions);
      break;
    }
    case "approval_resolved": break;
    case "tool_result": {
      const d = el("tool" + (ev.is_error ? " err" : ""), "result · " + ev.name);
      pre(d, ev.output);
      break;
    }
    case "done": flushBlocks(); break;
    case "error": flushBlocks(); el("tool err", "error", ev.message); break;
  }
}

function connect() {
  if (es) es.close();
  es = new EventSource("/api/events?token=" + encodeURIComponent(TOKEN));
  es.onmessage = (e) => { try { handle(JSON.parse(e.data)); } catch (_) {} };
  es.onerror = () => { /* EventSource auto-reconnects with Last-Event-ID */ };
}

function openApp() {
  $("gate").classList.add("hidden");
  for (const id of ["appHeader", "log", "composer"]) $(id).classList.remove("hidden");
  connect();
}

$("connectBtn").onclick = async () => {
  TOKEN = $("tokenInput").value.trim();
  const res = await fetch("/api/events?token=" + encodeURIComponent(TOKEN), { method: "GET" });
  if (res.status === 401) { $("gateErr").textContent = "Invalid token."; return; }
  res.body && res.body.cancel && res.body.cancel();
  localStorage.setItem("cowork_token", TOKEN);
  openApp();
};

$("sendBtn").onclick = () => {
  const text = $("input").value.trim();
  if (!text) return;
  api("/api/message", { text });
  $("input").value = ""; $("input").style.height = "auto";
};
$("input").addEventListener("input", (e) => {
  e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px";
});
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("sendBtn").click(); }
});
$("interruptBtn").onclick = () => api("/api/interrupt", {});
$("autoApprove").onchange = (e) => api("/api/settings", { auto_approve: e.target.checked });

if (TOKEN) openApp(); else $("tokenInput").focus();
</script>
</body>
</html>
