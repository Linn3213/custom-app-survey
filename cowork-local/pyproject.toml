[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cowork-local"
version = "0.1.0"
description = "A self-hosted, Cowork-like agent you drive from your phone — runs tasks on your own computer via the Claude API, with an approval gate for risky actions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Linn" }]
keywords = ["claude", "anthropic", "agent", "cowork", "automation"]
dependencies = [
    "anthropic>=0.69",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
cowork-local = "coworklocal.__main__:main"

[tool.setuptools.packages.find]
include = ["coworklocal*"]

[tool.setuptools.package-data]
coworklocal = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
